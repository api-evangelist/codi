aid: codi
name: Codi
description: >-
  Codi is a managed flexible office-space provider (office-as-a-service)
  operating in San Francisco and New York City. Codi delivers fully-managed
  private offices for teams, bundling furniture, cleaning and restocking,
  tech and network management, vendor coordination, room booking, and an AI
  office assistant into a single turnkey monthly subscription — positioned as
  an alternative to traditional commercial leases, coworking, and short-term
  space marketplaces such as Regus, Breather, and Peerspace. Codi was surfaced
  in the API Evangelist network as an a16z portfolio company; as of this
  profile it does not publish a public developer API, SDKs, or API
  documentation — its digital surface is a members' web app and a hosted help
  center.
